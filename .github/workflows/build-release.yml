name: Build & Release NekoVerse Companion

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nekoverse-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stamp release version
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: v0.1.0')
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0' }}
        run: |
          $version = $env:RELEASE_VERSION -replace '^v', ''
          npm version --no-git-tag-version $version

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Validate Electron services
        shell: pwsh
        run: npm run check

      - name: Build Windows x64 EXE packages
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win:x64

      - name: Show Windows outputs
        shell: pwsh
        run: Get-ChildItem -Path release -File | Format-Table Name,Length

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NekoVerse-Companion-Windows-x64
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 30

  linux-x64:
    name: Linux AMD64
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stamp release version
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: v0.1.0')
        shell: bash
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0' }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          npm version --no-git-tag-version "$VERSION"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Electron services
        run: npm run check

      - name: Build Linux AMD64 packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:linux:x64

      - name: Show Linux outputs
        run: ls -lah release/

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NekoVerse-Companion-Linux-amd64
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: v0.1.0')
    needs:
      - windows-x64
      - linux-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: NekoVerse-Companion-Windows-x64
          path: release-assets

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: NekoVerse-Companion-Linux-amd64
          path: release-assets

      - name: Show release assets
        run: ls -lah release-assets/

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release with generated changelog
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0' }}
          target_commitish: ${{ github.sha }}
          name: NekoVerse Companion ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0' }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.exe
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/SHA256SUMS.txt
