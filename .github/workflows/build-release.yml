name: Build & Release NekoVerse Companion

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nekoverse-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stamp version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          npm version --no-git-tag-version --allow-same-version $version

      - name: Stamp version from release commit
        if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release-v')
        shell: pwsh
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $version = $env:COMMIT_MESSAGE -replace '^release-v', ''
          $version = ($version -split '\s')[0]
          npm version --no-git-tag-version --allow-same-version $version

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Validate Electron services
        shell: pwsh
        run: npm run check

      - name: Build Windows x64 EXE packages
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win:x64

      - name: Show Windows outputs
        shell: pwsh
        run: Get-ChildItem -Path release -File | Format-Table Name,Length

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NekoVerse-Companion-Windows-x64
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 30

  linux-x64:
    name: Linux AMD64
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stamp version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version --no-git-tag-version --allow-same-version "$VERSION"

      - name: Stamp version from release commit
        if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release-v')
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          VERSION="${COMMIT_MESSAGE#release-v}"
          VERSION="${VERSION%% *}"
          npm version --no-git-tag-version --allow-same-version "$VERSION"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Electron services
        run: npm run check

      - name: Build Linux AMD64 packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:linux:x64

      - name: Show Linux outputs
        run: ls -lah release/

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NekoVerse-Companion-Linux-amd64
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release-v'))
    needs:
      - windows-x64
      - linux-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Resolve release version
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="${COMMIT_MESSAGE#release-v}"
            VERSION="${VERSION%% *}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: NekoVerse-Companion-Windows-x64
          path: release-assets

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: NekoVerse-Companion-Linux-amd64
          path: release-assets

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: NekoVerse Companion ${{ env.TAG }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.exe
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/SHA256SUMS.txt
