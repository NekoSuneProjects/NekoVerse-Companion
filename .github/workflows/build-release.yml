name: Build & Release NekoVerse Companion

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Normal main-branch development builds supersede each other, but a release
  # commit/tag gets its own group so a later push cannot cancel publishing.
  group: nekoverse-build-${{ (startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.head_commit.message, 'release-v')) && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stamp version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          npm version --no-git-tag-version --allow-same-version $version

      - name: Stamp version from release commit
        if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release-v')
        shell: pwsh
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          $version = $env:COMMIT_MESSAGE -replace '^release-v', ''
          $version = ($version -split '\s')[0]
          npm version --no-git-tag-version --allow-same-version $version

      - name: Install dependencies with retry
        shell: pwsh
        run: |
          $max = 3
          for ($attempt = 1; $attempt -le $max; $attempt++) {
            Write-Host "npm install attempt $attempt of $max"
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq $max) { exit $LASTEXITCODE }
            Write-Warning "Dependency/Electron download failed. Cleaning partial install and retrying..."
            Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
            Start-Sleep -Seconds (10 * $attempt)
          }

      - name: Validate Electron services
        shell: pwsh
        run: npm run check

      - name: Build Windows x64 EXE packages
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          $max = 3
          for ($attempt = 1; $attempt -le $max; $attempt++) {
            Write-Host "electron-builder attempt $attempt of $max"
            npm run dist:win:x64
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq $max) { exit $LASTEXITCODE }
            Write-Warning "Build failed, likely a transient builder binary/CDN error. Retrying..."
            Remove-Item -Recurse -Force release -ErrorAction SilentlyContinue
            Start-Sleep -Seconds (10 * $attempt)
          }

      - name: Show Windows outputs
        shell: pwsh
        run: Get-ChildItem -Path release -File | Format-Table Name,Length

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NekoVerse-Companion-Windows-x64
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 30

  linux-x64:
    name: Linux AMD64
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Stamp version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version --no-git-tag-version --allow-same-version "$VERSION"

      - name: Stamp version from release commit
        if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release-v')
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          VERSION="${COMMIT_MESSAGE#release-v}"
          VERSION="${VERSION%% *}"
          npm version --no-git-tag-version --allow-same-version "$VERSION"

      - name: Install dependencies with retry
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "npm install attempt $attempt of 3"
            npm install --no-audit --no-fund
            code=$?
            if [ "$code" -eq 0 ]; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit "$code"; fi
            echo "Dependency/Electron download failed. Cleaning partial install and retrying..."
            rm -rf node_modules
            sleep $((attempt * 10))
          done

      - name: Validate Electron services
        run: npm run check

      - name: Build Linux AMD64 packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "electron-builder attempt $attempt of 3"
            npm run dist:linux:x64
            code=$?
            if [ "$code" -eq 0 ]; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit "$code"; fi
            echo "Build failed, likely a transient builder binary/CDN error. Retrying..."
            rm -rf release
            sleep $((attempt * 10))
          done

      - name: Show Linux outputs
        run: ls -lah release/

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NekoVerse-Companion-Linux-amd64
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release-v'))
    needs:
      - windows-x64
      - linux-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="${COMMIT_MESSAGE#release-v}"
            VERSION="${VERSION%% *}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Build release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail

          awk -v version="$VERSION" '
            $0 ~ "^## " version "([[:space:]]|$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes-section.md

          if [[ ! -s release-notes-section.md ]]; then
            echo "No CHANGELOG.md section found for $VERSION" >&2
            exit 1
          fi

          PREVIOUS_TAG="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n 1 || true)"

          {
            echo "## NekoVerse Companion $TAG"
            echo
            echo "Released automatically for [NekoSuneVR](https://github.com/NekoSuneVR) from the tested main-branch release candidate."
            echo
            cat release-notes-section.md
            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo
              echo "---"
              echo
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS_TAG...$TAG"
            fi
          } > release-notes.md

          cat release-notes.md

      - name: Ensure release tag exists
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            existing="$(git rev-list -n 1 "$TAG")"
            if [[ "$existing" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG already exists at $existing, expected $GITHUB_SHA" >&2
              exit 1
            fi
            echo "$TAG already points at this release commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$GITHUB_SHA" -m "NekoVerse Companion $TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: NekoVerse-Companion-Windows-x64
          path: release-assets

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: NekoVerse-Companion-Linux-amd64
          path: release-assets

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: NekoVerse Companion ${{ env.TAG }}
          body_path: release-notes.md
          generate_release_notes: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.exe
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/SHA256SUMS.txt
